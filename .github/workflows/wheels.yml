name: Build wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Compile libann's Vulkan shaders and collect the Vulkan headers once, so the
  # wheel builds (manylinux containers, Windows) and the sdist need neither
  # glslc nor the Vulkan SDK (see tools/prepare_vulkan.py)
  vulkan-prebuilt:
    name: Vulkan shaders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the Vulkan headers and glslc
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslc

      - name: Prepare vulkan_prebuilt
        run: python3 tools/prepare_vulkan.py --license /usr/share/doc/libvulkan-dev/copyright

      - uses: actions/upload-artifact@v4
        with:
          name: vulkan-prebuilt
          path: vulkan_prebuilt/

  sdist:
    name: Source distribution
    needs: vulkan-prebuilt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: vulkan-prebuilt
          path: vulkan_prebuilt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Check package metadata
        run: |
          python -m pip install twine
          twine check dist/*

      # Prove the sdist is self-contained: build and test it away from the
      # checkout, with Vulkan from the shaders it ships (no glslc here)
      - name: Install and test sdist
        env:
          PYANN_EXPECT_BLAS: openblas
          PYANN_EXPECT_GPU: vulkan
        run: |
          python -m pip install pytest numpy dist/*.tar.gz
          mkdir /tmp/sdist-test && cp -r tests /tmp/sdist-test/
          cd /tmp/sdist-test && python -m pytest tests

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: vulkan-prebuilt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,    os: macos-15,           archs: arm64 }
          - { name: linux-x86_64,   os: ubuntu-latest,      archs: x86_64 }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm,   archs: aarch64 }
          - { name: windows-x86_64, os: windows-latest,     archs: AMD64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Linux and Windows build Vulkan from these; the Linux build containers
      # get a copy of the whole checkout, this directory included
      - uses: actions/download-artifact@v4
        with:
          name: vulkan-prebuilt
          path: vulkan_prebuilt

      - uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl

  # The wheels are py3-none, so confirm they work on every Python we claim to support
  python-versions:
    name: Python ${{ matrix.python-version }}${{ matrix.numpy == false && ' (no NumPy)' || '' }}
    needs: wheels
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        numpy: [true]
        include:
          # NumPy is optional: the pure-Python paths must work without it
          - { python-version: "3.12", numpy: false }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # the binding-coverage tests read libann's headers

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: wheelhouse

      - name: Install the wheel
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install wheelhouse/*.whl
          if [ "${{ matrix.numpy }}" = "true" ]; then python -m pip install numpy; fi

      # Run from outside the checkout so the installed package is what gets tested
      - name: Test
        working-directory: ${{ runner.temp }}
        env:
          PYANN_EXPECT_BLAS: openblas
        run: |
          python -c "import pyann; print(pyann.__file__, pyann.__version__, pyann.backend_info())"
          python -m pytest "$GITHUB_WORKSPACE/tests" -q

  # The wheel tests run without a Vulkan driver, so they cover the CPU
  # fallback. Here the Linux wheel runs on lavapipe, Mesa's Vulkan driver that
  # runs on the CPU, so its Vulkan backend has to start and train
  vulkan-gpu:
    name: Vulkan on lavapipe (Linux wheel)
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # the binding-coverage tests read libann's headers

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lavapipe
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: wheelhouse

      - name: Install the wheel
        run: python -m pip install pytest numpy wheelhouse/*.whl

      - name: Test
        working-directory: ${{ runner.temp }}
        env:
          PYANN_EXPECT_BLAS: openblas
          PYANN_EXPECT_GPU: vulkan
        run: |
          python -c "import pyann; assert pyann.enable_gpu(), 'Vulkan did not start'; info = pyann.backend_info(); print(info); assert info['gpu_active'] == 'vulkan'"
          python -m pytest "$GITHUB_WORKSPACE/tests" -q

  # Releases are tag-driven: push vX.Y.Z to publish to PyPI, or a pre-release
  # tag such as vX.Y.ZrcN to publish to TestPyPI.
  release-meta:
    name: Release metadata
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag against package version
        id: meta
        run: |
          python -m pip install packaging
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, tomllib
          from packaging.version import Version

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          if Version(tag) != Version(version):
              raise SystemExit(f"::error::tag v{tag} does not match pyproject.toml version {version}")
          print(f"prerelease={str(Version(version).is_prerelease).lower()}")
          PY

  publish:
    name: Publish
    needs: [sdist, wheels, python-versions, vulkan-gpu, release-meta]
    runs-on: ubuntu-latest
    # Each index has its own trusted publisher bound to one of these environments
    environment: ${{ needs.release-meta.outputs.prerelease == 'true' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write   # trusted publishing: no API token needed
    steps:
      # Only the distributions: the run's other artifacts (vulkan-prebuilt)
      # would land in dist/ and fail the upload's metadata check
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -l dist

      - name: Publish to TestPyPI
        if: needs.release-meta.outputs.prerelease == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: needs.release-meta.outputs.prerelease != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
