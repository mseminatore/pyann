name: Build wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      # Prove the sdist is self-contained: build and test it away from the checkout
      - name: Install and test sdist
        env:
          PYANN_EXPECT_BLAS: openblas
        run: |
          python -m pip install pytest numpy dist/*.tar.gz
          mkdir /tmp/sdist-test && cp -r tests /tmp/sdist-test/
          cd /tmp/sdist-test && python -m pytest tests

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,    os: macos-14,           archs: arm64 }
          - { name: linux-x86_64,   os: ubuntu-latest,      archs: x86_64 }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm,   archs: aarch64 }
          - { name: windows-x86_64, os: windows-latest,     archs: AMD64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
