name: Build wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Check package metadata
        run: |
          python -m pip install twine
          twine check dist/*

      # Prove the sdist is self-contained: build and test it away from the checkout
      - name: Install and test sdist
        env:
          PYANN_EXPECT_BLAS: openblas
        run: |
          python -m pip install pytest numpy dist/*.tar.gz
          mkdir /tmp/sdist-test && cp -r tests /tmp/sdist-test/
          cd /tmp/sdist-test && python -m pytest tests

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,    os: macos-14,           archs: arm64 }
          - { name: linux-x86_64,   os: ubuntu-latest,      archs: x86_64 }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm,   archs: aarch64 }
          - { name: windows-x86_64, os: windows-latest,     archs: AMD64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl

  # Releases are tag-driven: push vX.Y.Z to publish to PyPI, or a pre-release
  # tag such as vX.Y.ZrcN to publish to TestPyPI.
  release-meta:
    name: Release metadata
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag against package version
        id: meta
        run: |
          python -m pip install packaging
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, tomllib
          from packaging.version import Version

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          if Version(tag) != Version(version):
              raise SystemExit(f"::error::tag v{tag} does not match pyproject.toml version {version}")
          print(f"prerelease={str(Version(version).is_prerelease).lower()}")
          PY

  publish:
    name: Publish to ${{ needs.release-meta.outputs.prerelease == 'true' && 'TestPyPI' || 'PyPI' }}
    needs: [sdist, wheels, release-meta]
    runs-on: ubuntu-latest
    # Each index has its own trusted publisher bound to one of these environments
    environment: ${{ needs.release-meta.outputs.prerelease == 'true' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write   # trusted publishing: no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -l dist

      - name: Publish to TestPyPI
        if: needs.release-meta.outputs.prerelease == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: needs.release-meta.outputs.prerelease != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
